<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="880" viewBox="0 0 1000 880" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="880" fill="#ffffff"/>
  <defs>
    <linearGradient id="cert" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c62828"/>
      <stop offset="55%" stop-color="#f9a825"/>
      <stop offset="80%" stop-color="#2e7d32"/>
      <stop offset="100%" stop-color="#455a64"/>
    </linearGradient>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#555"/></marker>
  </defs>

  <text x="500" y="42" text-anchor="middle" font-size="21" font-weight="700" fill="#111">The stack: where each problem lives — and why we drop to the bottom</text>
  <text x="500" y="66" text-anchor="middle" font-size="13" fill="#666">You cannot certify the top. You can certify the boundary. So the defense lives at the boundary, not the model.</text>

  <!-- certifiability gradient strip -->
  <rect x="24" y="100" width="26" height="560" rx="6" fill="url(#cert)"/>
  <text x="37" y="120" transform="rotate(90 37 120)" font-size="12" fill="#fff" font-weight="700">STOCHASTIC — can't certify</text>
  <text x="37" y="560" transform="rotate(90 37 560)" font-size="12" fill="#fff" font-weight="700">DETERMINISTIC — certifiable</text>

  <!-- helper: each band is name+property (left) and problem pills (right) -->
  <!-- BAND 1: Intent / reasoning -->
  <rect x="70" y="100" width="700" height="120" rx="8" fill="#ef5350" fill-opacity="0.13" stroke="#c62828" stroke-width="1.5"/>
  <text x="90" y="140" font-size="17" font-weight="700" fill="#c62828">INTENT / REASONING</text>
  <text x="90" y="160" font-size="12" fill="#8e2020">the prompt, the model's decision — "why"</text>
  <text x="90" y="178" font-size="12" fill="#8e2020" font-style="italic">unknowable, stochastic</text>
  <g font-size="12.5" fill="#111">
    <rect x="360" y="118" width="130" height="30" rx="15" fill="#fff" stroke="#c62828"/><text x="425" y="137" text-anchor="middle" font-weight="600">P2 Injection</text>
    <rect x="500" y="118" width="150" height="30" rx="15" fill="#fff" stroke="#c62828"/><text x="575" y="137" text-anchor="middle" font-weight="600">P3 Autonomous</text>
    <rect x="360" y="156" width="290" height="30" rx="15" fill="#fff" stroke="#c62828" stroke-dasharray="4 3"/><text x="505" y="175" text-anchor="middle">P4 two forces DIVERGE here (intent differs)</text>
  </g>

  <!-- BAND 2: Output / artifact -->
  <rect x="70" y="228" width="700" height="92" rx="8" fill="#f9a825" fill-opacity="0.15" stroke="#e08e00" stroke-width="1.5"/>
  <text x="90" y="262" font-size="17" font-weight="700" fill="#b06f00">OUTPUT / ARTIFACT</text>
  <text x="90" y="282" font-size="12" fill="#8a5a00">the code / text the model emits</text>
  <text x="90" y="300" font-size="12" fill="#8a5a00" font-style="italic">inspectable, but leaky</text>
  <g font-size="12.5" fill="#111">
    <rect x="360" y="258" width="300" height="30" rx="15" fill="#fff" stroke="#e08e00"/><text x="510" y="277" text-anchor="middle" font-weight="600">P9 Detectors miss it (static analysis / ASan fail)</text>
  </g>

  <!-- BAND 3: Execution / process -->
  <rect x="70" y="328" width="700" height="116" rx="8" fill="#42a5f5" fill-opacity="0.13" stroke="#1565c0" stroke-width="1.5"/>
  <text x="90" y="366" font-size="17" font-weight="700" fill="#1565c0">EXECUTION / PROCESS</text>
  <text x="90" y="386" font-size="12" fill="#0d4a8a">the running process — what it actually does</text>
  <text x="90" y="404" font-size="12" fill="#0d4a8a" font-style="italic">observable, deterministic footprint</text>
  <g font-size="12.5" fill="#111">
    <rect x="360" y="344" width="150" height="30" rx="15" fill="#fff" stroke="#1565c0"/><text x="435" y="363" text-anchor="middle" font-weight="600">P1 Observability</text>
    <rect x="520" y="344" width="140" height="30" rx="15" fill="#fff" stroke="#1565c0"/><text x="590" y="363" text-anchor="middle" font-weight="600">P10 Attacker view</text>
    <rect x="360" y="382" width="300" height="30" rx="15" fill="#fff" stroke="#1565c0" stroke-dasharray="4 3"/><text x="510" y="401" text-anchor="middle">P4 → ONE footprint (the forces converge here)</text>
  </g>

  <!-- BAND 4: The gate / syscall boundary (highlighted) -->
  <rect x="70" y="452" width="700" height="128" rx="8" fill="#66bb6a" fill-opacity="0.18" stroke="#2e7d32" stroke-width="3"/>
  <text x="90" y="488" font-size="17" font-weight="800" fill="#1b5e20">THE GATE / SYSCALL BOUNDARY</text>
  <text x="90" y="508" font-size="12" fill="#1b5e20">seccomp interception (rootless by number, rootful by argument)</text>
  <text x="90" y="526" font-size="12" fill="#1b5e20" font-weight="700">the one certifiable control</text>
  <g font-size="12" fill="#111">
    <rect x="90" y="540" width="130" height="28" rx="14" fill="#fff" stroke="#2e7d32"/><text x="155" y="558" text-anchor="middle" font-weight="600">P5 Certifiability</text>
    <rect x="228" y="540" width="120" height="28" rx="14" fill="#fff" stroke="#2e7d32"/><text x="288" y="558" text-anchor="middle" font-weight="600">P6 Interception</text>
    <rect x="356" y="540" width="170" height="28" rx="14" fill="#fff" stroke="#2e7d32"/><text x="441" y="558" text-anchor="middle" font-weight="600">P7 Rootless vs rootful</text>
    <rect x="534" y="540" width="120" height="28" rx="14" fill="#fff" stroke="#2e7d32"/><text x="594" y="558" text-anchor="middle" font-weight="600">P8 Completeness</text>
    <rect x="662" y="540" width="98" height="28" rx="14" fill="#fff" stroke="#b71c1c"/><text x="711" y="558" text-anchor="middle" font-weight="600" fill="#b71c1c">P11 Gate-defeat</text>
  </g>

  <!-- BAND 5: kernel / OS -->
  <rect x="70" y="588" width="700" height="72" rx="8" fill="#455a64" fill-opacity="0.12" stroke="#455a64" stroke-width="1.5"/>
  <text x="90" y="618" font-size="17" font-weight="700" fill="#37474f">KERNEL / OS</text>
  <text x="90" y="638" font-size="12" fill="#37474f">the real syscall executes here</text>
  <text x="420" y="628" font-size="12.5" fill="#b71c1c" font-style="italic">where the harm lands if the gate does not stop it</text>

  <!-- right-side annotations -->
  <path d="M772,270 C830,270 830,180 800,160" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="792" y="300" font-size="12" fill="#555"><tspan x="792" dy="0" font-weight="700">Everyone else</tspan><tspan x="792" dy="16">defends up here:</tspan><tspan x="792" dy="16">prompt filters,</tspan><tspan x="792" dy="16">output scanners.</tspan><tspan x="792" dy="16" font-style="italic">probabilistic, leaky</tspan></text>
  <path d="M772,516 C840,516 840,516 812,516" fill="none" stroke="#2e7d32" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="792" y="500" font-size="12" fill="#2e7d32"><tspan x="792" dy="0" font-weight="800">We defend here:</tspan><tspan x="792" dy="16">one deterministic</tspan><tspan x="792" dy="16">control, on the</tspan><tspan x="792" dy="16">footprint both</tspan><tspan x="792" dy="16">forces share.</tspan></text>

  <!-- generality envelope -->
  <text x="500" y="700" text-anchor="middle" font-size="13" fill="#616161" font-style="italic">P12 Generality — does this whole stack hold across models / harnesses / architectures / languages?  (NOT yet tested)</text>
  <rect x="60" y="90" width="720" height="590" rx="14" fill="none" stroke="#9e9e9e" stroke-width="1.5" stroke-dasharray="9 7"/>
</svg>
