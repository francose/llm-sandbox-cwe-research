<svg xmlns="http://www.w3.org/2000/svg" width="1290" height="748" viewBox="0 0 1290 748" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1290" height="748" fill="#ffffff"/>
  <defs>
    <linearGradient id="cert3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c62828"/><stop offset="52%" stop-color="#f9a825"/>
      <stop offset="80%" stop-color="#2e7d32"/><stop offset="100%" stop-color="#455a64"/>
    </linearGradient>
    <!-- actor cadence glyphs: the actor's temporal CHARACTER, repeated down its column -->
    <symbol id="g-human" viewBox="0 0 64 24"><polyline points="2,20 8,7 13,22 19,11 24,4 33,19 40,9 48,21 55,6 62,14" fill="none" stroke="#00695c" stroke-width="2"/></symbol>
    <symbol id="g-auto" viewBox="0 0 64 24"><path d="M5,21 L5,5 M16,21 L16,5 M27,21 L27,5 M38,21 L38,5 M49,21 L49,5 M60,21 L60,5" stroke="#757575" stroke-width="2"/></symbol>
    <symbol id="g-agent" viewBox="0 0 64 24"><path d="M3,21 L3,5 M7,21 L7,5 M11,21 L11,5 M31,21 L31,5 M35,21 L35,5 M39,21 L39,5 M58,21 L58,5 M62,21 L62,5" stroke="#6a1b9a" stroke-width="2"/></symbol>
    <marker id="a3" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6a1b9a"/></marker>
  </defs>

  <text x="645" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#111">Stack v3: chronological behavior is orthogonal to the stack — every layer emits a time signature</text>
  <text x="645" y="59" text-anchor="middle" font-size="12.5" fill="#666">Same layers, seen through time. Three actor classes leave a different signature at each layer. Attribution is measurement, never a gate.</text>

  <!-- certifiability gradient (still down the left) -->
  <rect x="22" y="112" width="18" height="458" rx="5" fill="url(#cert3)"/>
  <text x="31" y="128" transform="rotate(90 31 128)" font-size="10" fill="#fff" font-weight="700">STOCHASTIC</text>
  <text x="31" y="500" transform="rotate(90 31 500)" font-size="10" fill="#fff" font-weight="700">DETERMINISTIC</text>

  <!-- column headers: the three actor characters -->
  <text x="192" y="98" text-anchor="middle" font-size="12" font-weight="700" fill="#555">LAYER  ↓        ACTOR  →</text>
  <g>
    <rect x="336" y="74" width="300" height="30" rx="7" fill="#e0f2f1" stroke="#00695c"/>
    <use href="#g-human" x="348" y="79" width="46" height="18"/>
    <text x="470" y="88" text-anchor="middle" font-size="13" font-weight="800" fill="#00695c">HUMAN</text>
    <text x="470" y="100" text-anchor="middle" font-size="9.5" fill="#00695c">irregular, self-correcting</text>
  </g>
  <g>
    <rect x="642" y="74" width="300" height="30" rx="7" fill="#f5f5f5" stroke="#757575"/>
    <use href="#g-auto" x="654" y="79" width="46" height="18"/>
    <text x="792" y="88" text-anchor="middle" font-size="13" font-weight="800" fill="#616161">SCRIPTED AUTOMATION</text>
    <text x="792" y="100" text-anchor="middle" font-size="9.5" fill="#616161">metronomic, no learning</text>
  </g>
  <g>
    <rect x="948" y="74" width="300" height="30" rx="7" fill="#f3e5f5" stroke="#6a1b9a"/>
    <use href="#g-agent" x="960" y="79" width="46" height="18"/>
    <text x="1088" y="88" text-anchor="middle" font-size="13" font-weight="800" fill="#6a1b9a">LLM AGENT</text>
    <text x="1088" y="100" text-anchor="middle" font-size="9.5" fill="#6a1b9a">bursty, adaptive</text>
  </g>

  <!-- ===== ROW 1: Intent ===== -->
  <rect x="54" y="112" width="276" height="90" rx="7" fill="#ef5350" fill-opacity="0.13" stroke="#c62828" stroke-width="1.5"/>
  <text x="66" y="140" font-size="14" font-weight="700" fill="#c62828">INTENT /</text>
  <text x="66" y="157" font-size="14" font-weight="700" fill="#c62828">REASONING</text>
  <text x="66" y="178" font-size="10" fill="#8e2020">cadence of deciding</text>
  <g font-size="11" fill="#222">
    <rect x="339" y="112" width="294" height="90" rx="7" fill="#fff" stroke="#00695c" stroke-opacity="0.5"/>
    <use href="#g-human" x="351" y="122" width="56" height="20"/>
    <text x="351" y="162">slow, variable think-time;</text><text x="351" y="179">goals get revised; hesitation</text>
    <rect x="645" y="112" width="294" height="90" rx="7" fill="#fff" stroke="#757575" stroke-opacity="0.5"/>
    <use href="#g-auto" x="657" y="122" width="56" height="20"/>
    <text x="657" y="162">no reasoning layer —</text><text x="657" y="179">instant branch on config</text>
    <rect x="951" y="112" width="294" height="90" rx="7" fill="#fff" stroke="#6a1b9a" stroke-opacity="0.5"/>
    <use href="#g-agent" x="963" y="122" width="56" height="20"/>
    <text x="963" y="162">generation-paced deliberation;</text><text x="963" y="179">explicit plan, then revision</text>
  </g>

  <!-- ===== ROW 2: Output ===== -->
  <rect x="54" y="206" width="276" height="80" rx="7" fill="#f9a825" fill-opacity="0.15" stroke="#e08e00" stroke-width="1.5"/>
  <text x="66" y="232" font-size="14" font-weight="700" fill="#b06f00">OUTPUT /</text>
  <text x="66" y="249" font-size="14" font-weight="700" fill="#b06f00">ARTIFACT</text>
  <text x="66" y="269" font-size="10" fill="#8a5a00">cadence of producing</text>
  <g font-size="11" fill="#222">
    <rect x="339" y="206" width="294" height="80" rx="7" fill="#fff" stroke="#00695c" stroke-opacity="0.5"/>
    <use href="#g-human" x="351" y="214" width="56" height="20"/>
    <text x="351" y="252">edited over minutes;</text><text x="351" y="269">incremental saves, backtracking</text>
    <rect x="645" y="206" width="294" height="80" rx="7" fill="#fff" stroke="#757575" stroke-opacity="0.5"/>
    <use href="#g-auto" x="657" y="214" width="56" height="20"/>
    <text x="657" y="252">atomic emit (template);</text><text x="657" y="269">no edit sequence</text>
    <rect x="951" y="206" width="294" height="80" rx="7" fill="#fff" stroke="#6a1b9a" stroke-opacity="0.5"/>
    <use href="#g-agent" x="963" y="214" width="56" height="20"/>
    <text x="963" y="252">streamed bursts;</text><text x="963" y="269">regenerate-on-error</text>
  </g>

  <!-- ===== ROW 3: Execution ===== -->
  <rect x="54" y="290" width="276" height="90" rx="7" fill="#42a5f5" fill-opacity="0.13" stroke="#1565c0" stroke-width="1.5"/>
  <text x="66" y="318" font-size="14" font-weight="700" fill="#1565c0">EXECUTION /</text>
  <text x="66" y="335" font-size="14" font-weight="700" fill="#1565c0">PROCESS</text>
  <text x="66" y="356" font-size="10" fill="#0d4a8a">syscall inter-arrival</text>
  <text x="66" y="370" font-size="9" fill="#b71c1c" font-style="italic">(spoofable: inject sleeps)</text>
  <g font-size="11" fill="#222">
    <rect x="339" y="290" width="294" height="90" rx="7" fill="#fff" stroke="#00695c" stroke-opacity="0.5"/>
    <use href="#g-human" x="351" y="300" width="56" height="20"/>
    <text x="351" y="340">irregular command gaps</text><text x="351" y="357">(seconds–minutes)</text>
    <rect x="645" y="290" width="294" height="90" rx="7" fill="#fff" stroke="#757575" stroke-opacity="0.5"/>
    <use href="#g-auto" x="657" y="300" width="56" height="20"/>
    <text x="657" y="340">metronomic;</text><text x="657" y="357">fixed, deterministic ordering</text>
    <rect x="951" y="290" width="294" height="90" rx="7" fill="#fff" stroke="#6a1b9a" stroke-opacity="0.5"/>
    <use href="#g-agent" x="963" y="300" width="56" height="20"/>
    <text x="963" y="340">burst, gap, burst</text><text x="963" y="357">(one burst per model round-trip)</text>
  </g>

  <!-- ===== ROW 4: The Gate (highlighted, the strong row) ===== -->
  <rect x="54" y="384" width="276" height="118" rx="7" fill="#66bb6a" fill-opacity="0.18" stroke="#2e7d32" stroke-width="3"/>
  <text x="66" y="412" font-size="14" font-weight="800" fill="#1b5e20">THE GATE /</text>
  <text x="66" y="429" font-size="14" font-weight="800" fill="#1b5e20">BOUNDARY</text>
  <text x="66" y="450" font-size="10" fill="#1b5e20">reaction to denial</text>
  <text x="66" y="464" font-size="10" font-weight="800" fill="#1b5e20">over a window</text>
  <text x="66" y="484" font-size="9.5" font-weight="700" fill="#2e7d32">= LEAST spoofable,</text>
  <text x="66" y="497" font-size="9.5" font-weight="700" fill="#2e7d32">and the gate senses it</text>
  <g font-size="11.5" fill="#222">
    <rect x="339" y="384" width="294" height="118" rx="7" fill="#e0f2f1" stroke="#00695c" stroke-width="1.6"/>
    <use href="#g-human" x="351" y="396" width="56" height="20"/>
    <text x="351" y="446" font-weight="700">STOPS</text><text x="351" y="464">after the first block</text><text x="351" y="481" font-size="10" fill="#00695c">(learns / gives up)</text>
    <rect x="645" y="384" width="294" height="118" rx="7" fill="#f5f5f5" stroke="#757575" stroke-width="1.6"/>
    <use href="#g-auto" x="657" y="396" width="56" height="20"/>
    <text x="657" y="446" font-weight="700">REPEATS</text><text x="657" y="464">the blocked call, fixed rate</text><text x="657" y="481" font-size="10" fill="#616161">(no learning — flat train)</text>
    <rect x="951" y="384" width="294" height="118" rx="7" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="3"/>
    <use href="#g-agent" x="963" y="396" width="56" height="20"/>
    <text x="963" y="446" font-weight="800" fill="#4a148c">ADAPTS</text><text x="963" y="464">retries VARY toward same goal</text><text x="963" y="481" font-size="10" fill="#4a148c">(semantic coherence = hard to fake)</text>
  </g>

  <!-- ===== ROW 5: Kernel (merged, noise floor) ===== -->
  <rect x="54" y="506" width="276" height="60" rx="7" fill="#455a64" fill-opacity="0.12" stroke="#455a64" stroke-width="1.5"/>
  <text x="66" y="532" font-size="14" font-weight="700" fill="#37474f">KERNEL / OS</text>
  <text x="66" y="550" font-size="10" fill="#37474f">scheduling grain</text>
  <rect x="339" y="506" width="906" height="60" rx="7" fill="#eceff1" stroke="#455a64" stroke-opacity="0.5"/>
  <text x="792" y="532" text-anchor="middle" font-size="11.5" fill="#37474f">scheduler jitter = the noise floor for all three actors — and the strace-jitter confound</text>
  <text x="792" y="551" text-anchor="middle" font-size="11.5" font-style="italic" fill="#b71c1c">below the attribution plane: nothing here separates the actors. Use a jitter-clean tap (seccomp-notify / raw ptrace), not strace.</text>

  <!-- least-spoofable callout arrow to the gate row -->
  <path d="M300,455 C322,455 322,443 336,443" fill="none" stroke="#6a1b9a" stroke-width="1.6" marker-end="url(#a3)"/>

  <!-- bottom notes -->
  <text x="54" y="596" font-size="12" fill="#333"><tspan font-weight="700">Read it as:</tspan> time is orthogonal to the stack — every layer emits a signature, and each actor keeps its character (the glyph) down its whole column.</text>
  <text x="54" y="616" font-size="12" fill="#333"><tspan font-weight="700" fill="#2e7d32">The strong signal is the gate row:</tspan> stop / repeat / adapt — a closed-loop reaction to enforcement, not idle timing. The argument-aware rootful gate (P7) already records it.</text>
  <text x="54" y="636" font-size="12" fill="#333"><tspan font-weight="700" fill="#b71c1c">Boundaries:</tspan> attribution is MEASUREMENT, never a control (it can feed hold/escalate, but degrades to chance vs an adversary who controls timing + retry-shape).</text>
  <text x="54" y="656" font-size="12" fill="#333"><tspan font-weight="700">Needs a live-actor harness:</tspan> a compiled artifact runs the same whoever wrote it, so it carries ZERO actor cadence — instrument the live loop, not the binary.</text>

  <!-- generality envelope -->
  <rect x="44" y="70" width="1214" height="606" rx="14" fill="none" stroke="#9e9e9e" stroke-width="1.5" stroke-dasharray="9 7"/>
  <text x="651" y="698" text-anchor="middle" font-size="12" fill="#616161" font-style="italic">P12 Generality — does the temporal-signature story hold across models / harnesses / architectures / languages?  (NOT yet tested)</text>
</svg>
